    // --- 2. إعداد المتغيرات والتهيئة ---
    const container = document.getElementById('clinics-container');
    const searchInput = document.getElementById('search-input');
    const resultsCount = document.getElementById('results-count');
    const totalClinicsCount = document.getElementById('total-clinics-count');
    const specialtyFiltersContainer = document.getElementById('specialty-filters');
    const themeToggleBtn = document.getElementById('theme-toggle');
    
    let isAdminMode = false;
    let currentSpecialty = 'all';
    let currentSearchTerm = '';
    
    totalClinicsCount.textContent = clinicsData.length; // الإجمالي المبدئي

    // --- 3. توليد فلاتر التخصصات ديناميكياً ---
    function generateSpecialtyFilters() {
      const specialties = [...new Set(clinicsData.map(c => c.specialty.trim()).filter(s => s !== ""))];
      
      specialties.forEach(specialty => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-1.5 rounded-lg text-sm font-semibold shrink-0 transition-colors border border-slate-200';
        btn.dataset.specialty = specialty;
        btn.textContent = specialty;
        
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => {
             b.classList.remove('bg-emerald-600', 'text-white', 'shadow-sm', 'font-bold');
             b.classList.add('bg-slate-100', 'text-slate-700', 'font-semibold', 'border', 'border-slate-200');
          });
          btn.classList.remove('bg-slate-100', 'text-slate-700', 'font-semibold', 'border', 'border-slate-200');
          btn.classList.add('bg-emerald-600', 'text-white', 'shadow-sm', 'font-bold');
          
          currentSpecialty = specialty;
          filterAndRender();
        });
        
        specialtyFiltersContainer.appendChild(btn);
      });

      const btnAll = document.querySelector('.filter-btn[data-specialty="all"]');
      btnAll.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => {
             b.classList.remove('bg-emerald-600', 'text-white', 'shadow-sm', 'font-bold');
             b.classList.add('bg-slate-100', 'text-slate-700', 'font-semibold', 'border', 'border-slate-200');
          });
          btnAll.classList.remove('bg-slate-100', 'text-slate-700', 'font-semibold', 'border', 'border-slate-200');
          btnAll.classList.add('bg-emerald-600', 'text-white', 'shadow-sm', 'font-bold');
          
          currentSpecialty = 'all';
          filterAndRender();
      });
    }

    // --- 4. دالة التوليد (Render) الرئيسية ---
    function renderClinics(data) {
      container.innerHTML = ''; 
      resultsCount.textContent = `${data.length} عيادة`;
      
      if(data.length === 0) {
          container.innerHTML = '<p class="text-center text-slate-500 col-span-full font-bold py-8">لا توجد عيادات مطابقة لبحثك.</p>';
          return;
      }

      data.forEach(clinic => {
        let cleanPhone = "";
        if (clinic.phone) {
           const phoneMatch = clinic.phone.match(/\d{10,11}/);
           if (phoneMatch) cleanPhone = phoneMatch[0];
        }

        const phoneAction = cleanPhone ? `href="tel:${cleanPhone}"` : `onclick="alert('رقم الهاتف غير متوفر حالياً')"` ;
        const title = clinic.clinicName ? clinic.clinicName : clinic.doctorName;
        const subTitle = clinic.clinicName ? clinic.doctorName : '';
        
        const shareText = encodeURIComponent(`*${title}*\n${subTitle ? `👨‍⚕️ ${subTitle}\n` : ''}🩺 التخصص: ${clinic.specialty}\n🕒 المواعيد: ${clinic.appointments}\n📞 للحجز: ${cleanPhone || clinic.phone || 'غير متوفر'}\n🏢 المكان: مول أوزون الطبي - مرحلة ${clinic.phase} - وحدة ${clinic.unitCode}`);
        const shareLink = `https://wa.me/?text=${shareText}`;

        let adminTags = '';
        if (isAdminMode) {
            const statusColor = clinic.complianceStatus.includes('✅') ? 'text-emerald-600' : (clinic.complianceStatus.includes('⚪') ? 'text-amber-600' : 'text-slate-600');
            adminTags = `
              <div class="mt-3 p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs dark:bg-slate-800 dark:border-slate-700">
                <p class="font-bold text-slate-800 dark:text-slate-200 mb-1">الامتثال: <span class="${statusColor}">${clinic.complianceStatus || 'غير محدد'}</span></p>
                <p class="font-bold text-slate-800 dark:text-slate-200">النواقص: <span class="text-rose-600 dark:text-rose-400 font-normal">${clinic.missingPapers || 'لا يوجد'}</span></p>
              </div>
            `;
        }

        let borderClass = 'border-slate-200';
        if (isAdminMode) {
             if (clinic.complianceStatus.includes('قيد المراجعة')) borderClass = 'border-amber-400 border-2';
             else if (clinic.complianceStatus.includes('✅')) borderClass = 'border-emerald-400';
             else borderClass = 'border-rose-300';
        }

        const cardHTML = `
          <div class="bg-white rounded-xl shadow-sm border ${borderClass} p-5 hover:shadow-md transition-shadow flex flex-col relative overflow-hidden dark:bg-slate-800 dark:border-slate-700">
            
            <div class="flex justify-between items-center mb-4">
              <span class="bg-emerald-100 text-emerald-800 text-[11px] px-2 py-1 rounded font-bold dark:bg-emerald-900/50 dark:text-emerald-300">المرحلة ${clinic.phase}</span>
              <span class="bg-slate-100 text-slate-800 text-[11px] px-2 py-1 rounded font-bold border border-slate-200 dark:bg-slate-700 dark:text-slate-200 dark:border-slate-600">وحدة ${clinic.unitCode}</span>
            </div>
            
            <h3 class="font-bold text-lg text-slate-900 mb-1 dark:text-white">${title}</h3>
            ${subTitle ? `<p class="text-sm text-slate-600 mb-3 border-b border-slate-100 pb-2 dark:text-slate-300 dark:border-slate-700">👨‍⚕️ ${subTitle}</p>` : `<div class="mb-3 border-b border-slate-100 pb-2 dark:border-slate-700"></div>`}
            
            <div class="text-sm text-slate-700 space-y-3 mb-5 flex-1 dark:text-slate-300">
              <p class="flex items-start gap-2">
                <span class="text-emerald-600 dark:text-emerald-400">🩺</span> 
                <span class="font-bold">${clinic.specialty}</span>
              </p>
              <p class="flex items-start gap-2">
                <span class="text-emerald-600 dark:text-emerald-400">🕒</span> 
                <span class="leading-relaxed text-xs font-semibold">${clinic.appointments || 'غير متوفر'}</span>
              </p>
              ${adminTags}
            </div>
            
            <div class="flex gap-2 mt-auto">
              <a ${phoneAction} class="flex-[2] text-center bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg text-sm font-bold transition-colors cursor-pointer flex items-center justify-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-2.896-1.596-5.25-3.95-6.847-6.847l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z" /></svg>
                اتصال
              </a>
              <a href="${shareLink}" target="_blank" class="flex-[1] text-center bg-slate-100 border border-slate-300 hover:bg-slate-200 text-slate-700 py-2.5 rounded-lg text-sm font-bold transition-colors cursor-pointer flex items-center justify-center dark:bg-slate-700 dark:border-slate-600 dark:text-slate-200 dark:hover:bg-slate-600" title="مشاركة عبر واتساب">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z" /></svg>
              </a>
            </div>
          </div>
        `;
        container.innerHTML += cardHTML;
      });
    }

    // --- 5. دالة الفلترة والبحث ---
    function filterAndRender() {
      let filteredData = clinicsData;

      if (currentSpecialty !== 'all') {
        filteredData = filteredData.filter(clinic => clinic.specialty === currentSpecialty);
      }

      if (currentSearchTerm) {
        filteredData = filteredData.filter(clinic => 
          clinic.doctorName.toLowerCase().includes(currentSearchTerm) ||
          (clinic.clinicName && clinic.clinicName.toLowerCase().includes(currentSearchTerm)) ||
          clinic.specialty.toLowerCase().includes(currentSearchTerm) ||
          clinic.unitCode.toLowerCase().includes(currentSearchTerm) ||
          (clinic.phase && clinic.phase.toLowerCase().includes(currentSearchTerm))
        );
      }

      renderClinics(filteredData);
    }

    // --- 6. تفعيل البحث والكلمة السرية للآدمن ---
    searchInput.addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase().trim();
      
      if (searchTerm === 'adminozone') {
        isAdminMode = true;
        e.target.value = ''; 
        currentSearchTerm = '';
        filterAndRender();
        alert('تم تفعيل وضع الإدارة 🛡️\nستظهر الآن حالات الامتثال والنواقص.');
        return;
      } else if (searchTerm === 'exitadmin') {
        isAdminMode = false;
        e.target.value = '';
        currentSearchTerm = '';
        filterAndRender();
        alert('تم الخروج من وضع الإدارة 🔒');
        return;
      }

      currentSearchTerm = searchTerm;
      filterAndRender();
    });

    // --- 7. تفعيل الوضع الليلي ---
    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      if(document.documentElement.classList.contains('dark')){
         themeToggleBtn.textContent = '☀️';
      } else {
         themeToggleBtn.textContent = '🌙';
      }
    });

    // --- التشغيل المبدئي ---
    generateSpecialtyFilters();
    renderClinics(clinicsData);

  </script>
